version: "3.8"

services:
  karunia-backend:
    image: node:20-alpine
    container_name: karunia-backend
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm run start:dev"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      - karunia-db

  karunia-frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - karunia-backend

  karunia-db:
    image: postgres:15
    environment:
      POSTGRES_USER: umbughn
      POSTGRES_PASSWORD: BDTux9JpzGMAQi1i
      POSTGRES_DB: karunia_saas
    ports:
      - "5432:5432"
    volumes:
      - karunia_db_data:/var/lib/postgresql/data

volumes:
  karunia_db_data:
